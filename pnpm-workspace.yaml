packages:
  - server
  - web
allowBuilds:
  '@scarf/scarf': true
  '@swc/core': true
  'better-sqlite3': true
  esbuild: true
  # false: msw's postinstall writes the browser service worker. Tests run in
  # node, where MSW intercepts at the request level and never needs it.
  msw: false
minimumReleaseAgeExclude:
  - '@forinda/kickjs-cli@6.11.2'
  - '@forinda/kickjs@6.7.0'
